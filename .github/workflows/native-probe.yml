name: Public jsoncpp ARM64 acceptance
on:
  push:
    branches: [codex/jsoncpp-public-arm64-probe]
permissions:
  contents: read
jobs:
  consume:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install public jsoncpp on native ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/mamba-org/micromamba-releases/releases/download/1.5.10-0/micromamba-win-64' -OutFile C:\micromamba.exe
          & C:\micromamba.exe create -y -r C:\mamba -p C:\consumer --platform win-arm64 --override-channels --strict-channel-priority -c conda-forge python=3.14 cmake ninja jsoncpp=1.9.8=h11ae69d_2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & C:\consumer\python.exe recipe\consumer\verify.py metadata
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile and run published jsoncpp consumer as ARM64
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64_arm64
          if errorlevel 1 exit /b 1
          set "PATH=C:\consumer\Library\bin;C:\consumer;%PATH%"
          cmake -S recipe\consumer -B consumer-build -G Ninja -DCMAKE_PREFIX_PATH=C:/consumer/Library
          if errorlevel 1 exit /b 1
          cmake --build consumer-build
          if errorlevel 1 exit /b 1
          C:\consumer\python.exe recipe\consumer\verify.py pe consumer-build\jsoncpp_consumer.exe
          if errorlevel 1 exit /b 1
          consumer-build\jsoncpp_consumer.exe
          if errorlevel 1 exit /b 1
